<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="robots" content="noindex,nofollow">
<title>Genezis Admin</title>
<script>try{var t=localStorage.getItem('gza_theme');if(!t)t='dark';document.documentElement.dataset.theme=t}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;--bg2:#0d1428;--card:#111b33;--card2:#16223f;--line:#ffffff17;--tx:#e9efff;--mu:#8e9bbb;
  --a:#2ee6a6;--b:#38bdf8;--c:#9d7bff;--ok:#2ee6a6;--warn:#fbbf24;--bad:#ff5d73;
  --grad:linear-gradient(135deg,#2ee6a6,#38bdf8);--on:#04140f;--sh:0 12px 34px #0007;--r:18px;
  --glow1:#2ee6a61f;--glow2:#9d7bff1f;
}
:root[data-theme=light]{
  --bg:#eef3fb;--bg2:#fff;--card:#fff;--card2:#f3f7fd;--line:#0f1b3318;--tx:#0e1a33;--mu:#5c6a89;
  --a:#079a6e;--b:#0b7fc0;--c:#6b3fe0;--ok:#079a6e;--warn:#b7791f;--bad:#d62f48;
  --grad:linear-gradient(135deg,#0fbf8a,#1a9be0);--on:#fff;--sh:0 10px 26px #1c2c5a1a;--glow1:#0fbf8a1c;--glow2:#6b3fe01a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,Tahoma,sans-serif;color:var(--tx);min-height:100vh;font-size:15px;line-height:1.6;
  background:radial-gradient(900px 520px at 85% -8%,var(--glow1),transparent 62%),radial-gradient(800px 480px at 0% 0%,var(--glow2),transparent 58%),var(--bg);background-attachment:fixed}
body.noscroll{overflow:hidden}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{flex:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:plaintext;word-break:break-all}
.mu{color:var(--mu)}.sm{font-size:12.5px}.big{font-size:16px;font-weight:700}.grow{flex:1;min-width:0}

/* ---------- تسجيل الدخول ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px 24px;box-shadow:var(--sh);text-align:center}
.logo{width:64px;height:64px;border-radius:20px;background:var(--grad);display:grid;place-items:center;margin:0 auto 14px;color:var(--on);font-weight:800;font-size:30px;box-shadow:0 10px 30px #2ee6a644}
.lbox h1{font-size:22px;font-weight:800}.lbox p{color:var(--mu);margin:4px 0 18px;font-size:14px}
#lerr{color:var(--bad);min-height:22px;font-size:13.5px;margin-top:8px}

/* ---------- الهيكل ---------- */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-left:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),transparent);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:42px;height:42px;border-radius:14px;font-size:20px;margin:0;box-shadow:none}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.2}.brand small{color:var(--mu);font-size:12px}
.nv{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;color:var(--mu);font-weight:600;position:relative;transition:.15s;white-space:nowrap}
.nv:hover{background:var(--card2);color:var(--tx)}
.nv.on{background:var(--grad);color:var(--on)}
.nv .bd{margin-right:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-weight:700}
.nv.on .bd{background:var(--on);color:var(--a)}
.side-f{margin-top:auto;display:grid;gap:4px}
main{padding:22px 26px 40px;min-width:0;max-width:1100px;width:100%}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top h1{font-size:24px;font-weight:800;flex:1}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mu);transition:.15s}
.ib:hover{color:var(--tx);border-color:var(--a)}
.ib.sp svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px #2ee6a622;transition:.2s}
.dot.sync{background:var(--warn);box-shadow:0 0 0 4px #fbbf2422}.dot.bad{background:var(--bad);box-shadow:0 0 0 4px #ff5d7322}
#tabs{display:none}

/* ---------- مكوّنات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3,.sheet h3{font-size:16.5px;font-weight:800}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .hd h3{flex:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;text-align:right;transition:.15s;width:100%}
button.tile:hover{border-color:var(--c);transform:translateY(-2px)}
.ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.tv{font-size:23px;font-weight:800;line-height:1.15}
.tl{font-size:12.5px;color:var(--mu)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mu);font-weight:600;font-size:13.5px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.chip.on{background:var(--grad);color:var(--on);border-color:transparent}
.chip i{font-style:normal;font-size:11.5px;background:#ffffff1f;border-radius:99px;padding:0 7px}
.chip.on i{background:#0003}
input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{width:100%;padding:12px 14px;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;outline:none;transition:.15s;margin-bottom:10px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
label.f{display:block;font-size:13px;color:var(--mu);margin:0 4px 5px;font-weight:600}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;right:13px;top:13px;color:var(--mu)}
.search input{padding-right:42px;margin:0}
.btn{padding:12px 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s;border:1.5px solid transparent}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.pri{background:var(--grad);color:var(--on)}
.btn.ghost{border-color:var(--line);background:var(--card2)}
.btn.ghost:hover{border-color:var(--a)}
.btn.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.btn.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.blk{width:100%}.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;min-width:92px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.enter .item{animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.item.off{opacity:.62}
.ih{display:flex;gap:10px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mu);font-size:13px;margin-top:8px}
.meta b{color:var(--tx)}
.badge{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.sPending{background:#fbbf2420;color:var(--warn)}.sApproved,.sCompleted{background:#2ee6a620;color:var(--ok)}.sRejected{background:#ff5d7320;color:var(--bad)}
.badge.v{background:#9d7bff22;color:var(--c)}.badge.b{background:#38bdf822;color:var(--b)}.badge.x{background:#ff5d7320;color:var(--bad)}
.cps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cp{display:flex;gap:7px;align-items:center;padding:7px 12px;border-radius:12px;background:var(--card2);border:1px dashed var(--line);font-size:13px;max-width:100%}
.cp:hover{border-color:var(--a)}
.cp .mono{color:var(--a);font-weight:700}
.note{margin-top:9px;font-size:13px;padding:8px 12px;border-radius:12px;background:var(--card2);color:var(--mu)}
.note.ok{color:var(--ok)}.note.bad{color:var(--bad)}
.av{width:44px;height:44px;border-radius:15px;background:var(--grad);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.av.bt{background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.skl{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tags span{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--line)}

/* مفاتيح التبديل وصناديق الاختيار */
.sw,.ck{position:relative;display:inline-block;flex:none;cursor:pointer}
.sw input,.ck input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{display:block;width:46px;height:27px;border-radius:99px;background:var(--card2);border:1.5px solid var(--line);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:.2s}
.sw input:checked+i{background:var(--grad);border-color:transparent}
.sw input:checked+i::after{right:22px;background:var(--on)}
.ck i{display:block;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--card2);transition:.15s;position:relative}
.ck input:checked+i{background:var(--grad);border-color:transparent}
.ck input:checked+i::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.row2{display:flex;align-items:center;gap:12px;padding:10px 2px}

/* رسم الأسبوع */
.bars{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:8px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bp{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.bp i{display:block;width:42%;max-width:20px;border-radius:7px 7px 3px 3px;min-height:3px;position:relative;transition:height .4s}
.bp i.g{background:var(--grad)}.bp i.u{background:var(--c)}
.bp i b{position:absolute;top:-17px;right:50%;transform:translateX(50%);font-size:11px;font-weight:700;color:var(--mu)}
.bc span{font-size:11.5px;color:var(--mu)}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--mu)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

/* نوافذ */
#mo,#mo2{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
#mo2{z-index:60}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--bg2);border:1px solid var(--line);width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;animation:up .2s;overscroll-behavior:contain}
.sheet.sm{width:min(420px,100%)}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.x{width:36px;height:36px;border-radius:12px;background:var(--card2);color:var(--mu);display:grid;place-items:center}
.imgbox{text-align:center;min-height:120px;display:grid;place-items:center}
.imgbox img{max-width:100%;border-radius:14px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--a);animation:spin .7s linear infinite}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:11px 20px;border-radius:99px;box-shadow:var(--sh);z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad);color:var(--bad)}
#bulk{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40;background:var(--card2);border:1px solid var(--a);box-shadow:var(--sh);border-radius:20px;padding:10px 12px;display:flex;gap:8px;align-items:center;width:max-content;max-width:94vw}
#bulk b{padding:0 8px;font-size:14px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details ol{margin:10px 22px 0 0;color:var(--mu);font-size:13.5px;line-height:2}
details ol b{color:var(--tx)}
.err{background:color-mix(in srgb,var(--bad) 14%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad);padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px}

/* ---------- موبايل ---------- */
@media(max-width:900px){
  #app{display:block}
  aside{display:none}
  main{padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
  .top h1{font-size:21px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:12px;gap:10px}.ti{width:38px;height:38px}.tv{font-size:20px}
  .two{grid-template-columns:1fr}
  #tabs{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:2px;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs .nv{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;min-width:68px;flex:1;border-radius:13px;justify-content:center}
  #tabs .nv .bd{position:absolute;top:0;left:12px;margin:0;min-width:17px;height:17px;font-size:10px}
  #bulk{bottom:calc(86px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom))}
}
@media(min-width:700px){
  #mo,#mo2{align-items:center}.sheet{border-radius:26px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div id="login" class="hidden">
  <form class="lbox" id="lform" autocomplete="on">
    <div class="logo">G</div>
    <h1>لوحة تحكم Genezis</h1>
    <p>أدخل كلمة مرور الأدمن للمتابعة</p>
    <input type="password" id="lpass" placeholder="كلمة المرور" autocomplete="current-password" required>
    <button class="btn pri blk" id="lbtn" type="submit">دخول</button>
    <div id="lerr"></div>
  </form>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="logo">G</div><div><b>Genezis</b><small>لوحة الأدمن</small></div></div>
    <nav id="side" style="display:grid;gap:4px"></nav>
    <div class="side-f">
      <button class="nv" data-act="theme"><span id="thIco"></span><span>تغيير الثيم</span></button>
      <button class="nv" data-act="logout"><span id="loIco"></span><span>تسجيل الخروج</span></button>
    </div>
  </aside>
  <main>
    <div class="top">
      <h1 id="ttl"></h1>
      <span class="dot" id="dot" title="حالة المزامنة"></span>
      <button class="ib" data-act="reload" id="rl" title="تحديث"></button>
      <button class="ib" data-act="theme" id="thb" title="الثيم"></button>
      <button class="ib" data-act="logout" id="lob" title="خروج"></button>
    </div>
    <div id="view"></div>
  </main>
  <nav id="tabs"></nav>
</div>

<div id="bulk" class="hidden"></div>
<div id="mo" class="hidden"></div>
<div id="mo2" class="hidden"></div>
<div id="toast"></div>

<script>
// ======================= الإعدادات =======================
const API = 'https://script.google.com/macros/s/AKfycbzc3OvIAMMVdXEyZb_f3scQ5_kkdA2JrtwlqnQ-dfGuRwGECI5bM90W87wDKyV_S49p/exec';
const POLL_MS = 4000;      // فحص التغييرات (رد فوري لو مفيش جديد)
const FULL_EVERY = 22;     // تحديث كامل كل ~90 ثانية (لو عدّلت الشيت يدوياً)

// ======================= أدوات =======================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('en-US');
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const ST = { Pending: 'قيد المراجعة', Approved: 'مقبول', Rejected: 'مرفوض', Completed: 'مكتمل' };
const EV_DEFAULT = { signup: 'مستخدم جديد', gmail_new: 'طلب جيميل جديد', withdraw_new: 'طلب سحب جديد', gmail_review: 'مراجعة جيميل', withdraw_review: 'مراجعة سحب', user_edit: 'تعديل مستخدم', security: 'تنبيهات أمنية', report: 'تقارير الحالة' };

const IC = {
  home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  cash: '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M16 15h2"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.7.2 4.5 2 4.5 5"/>',
  bot: '<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M9 13h.01M15 13h.01M9 16h6"/><circle cx="12" cy="4" r="1"/>',
  mega: '<path d="M3 11v3a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>',
  gift: '<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12M12 8c-2-4-6-3-5 0 .5 1.5 3 1 5 0zm0 0c2-4 6-3 5 0-.5 1.5-3 1-5 0z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',

function ago(t) {
  const d = new Date(t); if (isNaN(d)) return '';
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return 'الآن';
  if (m < 60) return 'منذ ' + m + ' د';
  if (m < 1440) return 'منذ ' + Math.floor(m / 60) + ' س';
  if (m < 4320) return 'منذ ' + Math.floor(m / 1440) + ' يوم';
  return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
}
function toast(m, bad) {
  const t = $('#toast'); t.textContent = m; t.className = (bad ? 'bad ' : '') + 'show';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function beep() {
  if (LS.get('gza_snd') === '0') return;
  try {
    const c = beep.c || (beep.c = new (window.AudioContext || window.webkitAudioContext)());
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, c.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .35);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .36);
  } catch (e) {}
}
function copy(v) {
  const ok = () => toast('تم النسخ');
  try { navigator.clipboard.writeText(v).then(ok, fb); } catch (e) { fb(); }

    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); ok(); } catch (e) { toast('تعذر النسخ', true); }
    t.remove();
  }
}

async function api(action, data = {}) {
  try {
    const r = await fetch(API, { method: 'POST', cache: 'no-store', body: JSON.stringify({ action, token: T, ...data }) });
    const j = await r.json();
    if (j && j.error === 'unauthorized') { logout('انتهت الجلسة، سجّل الدخول من جديد'); return { success: false, error: 'unauthorized' }; }
    return j;
  } catch (e) { return { success: false, error: 'تعذر الاتصال بالخادم' }; }
}
function dot(s) { const d = $('#dot'); if (d) d.className = 'dot ' + (s === 'ok' ? '' : s); }

async function sync(force) {
  if (!T || (document.hidden && !force)) return;
  if (busy) { if (force) again = true; return; }
  busy = true; dot('sync');
  const r = await api('adminSync', { ver: force ? '' : VER });
  busy = false;
  if (r.success) {
    srvErr = '';
    if (r.changed !== false) applyData(r);
    dot('ok');
  } else if (r.error !== 'unauthorized') {
    dot('bad');
    srvErr = /غير معروف/.test(r.error || '') ? 'الباك إند قديم: الصق Code.gs الجديد ثم Deploy > New version' : (r.error || '');
    if (!D) refresh();
  }
  const b = $('#rl'); if (b) b.classList.remove('sp');
  if (again) { again = false; sync(true); }
}

function applyData(r) {
  const old = D;
  D = r; VER = r.ver;
  if (old) {
    const og = new Set(old.gmails.filter(x => x.status === 'Pending').map(x => x.id));
    const ow = new Set(old.withdrawals.filter(x => x.status === 'Pending').map(x => x.id));
    const ng = D.gmails.filter(x => x.status === 'Pending' && !og.has(x.id)).length;
    const nw = D.withdrawals.filter(x => x.status === 'Pending' && !ow.has(x.id)).length;
    if (ng || nw) { toast([ng ? ng + ' جيميل جديد' : '', nw ? nw + ' طلب سحب جديد' : ''].filter(Boolean).join(' + ')); beep(); }
  }
  // تنظيف الاختيارات التي لم تعد معلّقة
  Object.keys(F.sel).forEach(id => { const g = D.gmails.find(x => x.id === id); if (!g || g.status !== 'Pending') delete F.sel[id]; });
  refresh();
  clearTimeout(applyData.t);
  applyData.t = setTimeout(() => LS.set('gza_c', JSON.stringify({ ver: VER, D })), 800);
}

function days7(list, key) {
  const base = new Date(); base.setHours(0, 0, 0, 0);
  const out = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(base); d.setDate(d.getDate() - i); out.push({ d, n: 0 }); }
  list.forEach(x => { const t = new Date(x[key]); if (isNaN(t)) return; t.setHours(0, 0, 0, 0); const o = out.find(o => o.d.getTime() === t.getTime()); if (o) o.n++; });
  return out;
}

async function reviewGmail(id, decision, note) {
  const g = D.gmails.find(x => x.id === id); if (!g || g.status !== 'Pending') return;
  const old = [g.status, g.note];
  g.status = decision === 'approve' ? 'Approved' : 'Rejected'; g.note = note; delete F.sel[id]; refresh();
  const r = await api('adminReviewGmail', { id, decision, note });
  if (!r.success) { [g.status, g.note] = old; refresh(); toast(r.error || 'فشل', true); }
  else toast(decision === 'approve' ? 'تم القبول ✓' : 'تم الرفض');
  sync(true);
}
async function reviewWd(id, decision) {
  const w = D.withdrawals.find(x => x.id === id); if (!w || w.status !== 'Pending') return;
  w.status = decision === 'approve' ? 'Completed' : 'Rejected'; refresh();
  const r = await api('adminReviewWithdrawal', { id, decision });
  if (!r.success) { w.status = 'Pending'; refresh(); toast(r.error || 'فشل', true); }
  else toast(decision === 'approve' ? 'تم تأكيد التحويل ✓' : 'تم الرفض واسترداد الرصيد');
  sync(true);
}

const blobB64 = b => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1]);
  r.onerror = () => no(new Error('تعذر قراءة الملف'));
  r.readAsDataURL(b);
});
function progress(pid, tid) {
  return (frac, txt) => {
    const p = $('#' + pid), t = $('#' + tid); if (!p) return;
    p.classList.remove('hidden');
    p.firstElementChild.style.width = Math.round(frac * 100) + '%';
    if (t) t.textContent = txt || (Math.round(frac * 100) + '%');
  };
}
// رفع ملف إلى Drive على دفعات (2MB لكل دفعة)
async function upFile(kind, file, onp) {
  const s = await api('adminUploadStart', { kind, size: file.size, mime: file.type });
  if (!s.success) throw new Error(s.error || 'تعذر بدء الرفع');
  const CH = 2 * 1024 * 1024;
  let start = 0, id = null;
  while (start < file.size) {
    const end = Math.min(file.size, start + CH);
    const data = await blobB64(file.slice(start, end));
    let r, tries = 0;
    do { r = await api('adminUploadChunk', { session: s.session, start, total: file.size, data }); }
    while (!r.success && r.error !== 'unauthorized' && ++tries < 3);
    if (!r.success) throw new Error(r.error || 'فشل الرفع');
    start = end;
    onp(start / file.size, 'جاري الرفع ' + Math.round(start / file.size * 100) + '% — لا تغلق الصفحة');
    if (r.done) id = r.id;
  }
  if (!id) throw new Error('لم يكتمل الرفع، أعد المحاولة');
  return id;
}

      <label class="f">رفع فيديو من الجهاز</label><input type="file" id="uvid" accept="video/*">

Object.assign(ACT, {
  async updpub() {
    const version = parseInt($('#uv').value, 10), name = $('#un2').value.trim(), notes = $('#unt').value.trim(), force = $('#ufo').checked;
    const f = ($('#uapk').files || [])[0];
    if (!(version > 0)) return toast('اكتب رقم الإصدار', true);
    if (!f) {
      if (!D.settings.apkFileId) return toast('اختر ملف APK أولاً', true);
      const r = await api('adminSaveSettings', { settings: { latestVersion: String(version), updateName: name, updateNotes: notes, updateForce: force ? 'true' : 'false' } });
      if (r.success) { UP.lock = false; toast('تم الحفظ'); sync(true); } else toast(r.error || 'فشل', true);
      return;
    }
    if (!/\.apk$/i.test(f.name)) return toast('الملف لازم يكون بصيغة APK', true);
    if (!(await ask({ title: 'نشر التحديث؟', msg: 'سيظهر لكل مستخدم إصداره أقل من ' + version + '.', ok: 'نشر' }))) return;
    UP.busy = true;
    try {
      const id = await upFile('apk', f, progress('upg', 'upt'));
      const r = await api('adminUploadFinish', { kind: 'apk', id, version, name, notes, force });
      if (!r.success) throw new Error(r.error || 'فشل النشر');
      UP.busy = false; UP.lock = false; toast('تم نشر التحديث ✓'); sync(true);
    } catch (e) { UP.busy = false; toast(e.message || 'فشل الرفع', true); }
  },
  async updrm() {
    if (!(await ask({ title: 'إيقاف التحديث؟', msg: 'سيُحذف ملف APK ولن تظهر رسالة التحديث لأحد.', ok: 'إيقاف', bad: true }))) return;
    const r = await api('adminRemoveApk');
    if (r.success) { UP.lock = false; toast('تم إيقاف التحديث'); sync(true); } else toast(r.error || 'فشل', true);
  },
  async vidup() {
    const f = ($('#uvid').files || [])[0];
    if (!f) return toast('اختر ملف فيديو', true);
    UP.busy = true;
    try {
      const id = await upFile('video', f, progress('vpg', 'vpt'));
      const r = await api('adminUploadFinish', { kind: 'video', id });
      if (!r.success) throw new Error(r.error || 'فشل النشر');
      UP.busy = false; UP.lock = false; toast('تم رفع الفيديو ✓ (قد يحتاج Drive دقائق لمعالجته)'); sync(true);
    } catch (e) { UP.busy = false; toast(e.message || 'فشل الرفع', true); }
  },
  async vidlink() {
    const u = $('#vlk').value.trim();
    if (!/^https?:\/\//i.test(u)) return toast('اكتب رابطاً صحيحاً يبدأ بـ https://', true);
    const r = await api('adminSaveSettings', { settings: { videoUrl: u, videoFileId: '' } });
    if (r.success) { UP.lock = false; toast('تم حفظ الرابط'); sync(true); } else toast(r.error || 'فشل', true);
  },
  async vidrm() {
    if (!(await ask({ title: 'حذف الفيديو؟', msg: 'سيختفي زر طريقة عمل الجميل من التطبيق.', ok: 'حذف', bad: true }))) return;
    const r = await api('adminRemoveVideo');
    if (r.success) { UP.lock = false; toast('تم حذف الفيديو'); sync(true); } else toast(r.error || 'فشل', true);
  },
  async wdsave() {
    const r = await api('adminSaveSettings', { settings: { firstMinWithdraw: $('#fmw').value, firstWithdrawFee: $('#fwf').value } });
    if (r.success) { UP.lock = false; toast('تم الحفظ'); sync(true); } else toast(r.error || 'فشل', true);
  }
});

$('#lform').addEventListener('submit', async e => {

function logout(msg) {
  T = ''; D = null; VER = ''; LS.del('gza_t'); LS.del('gza_c'); closeModal();
  $('#app').classList.add('hidden'); $('#bulk').classList.add('hidden'); $('#login').classList.remove('hidden');
