<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3df5">
<title>Gift</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#5b3df5;--p2:#8b5cf6;--bg:#f4f3fb;--card:#fff;--tx:#1b1b2f;--mu:#6b6b84;--ok:#12a150;--er:#e5484d;--wa:#d98a06;--bd:#e6e4f4;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;padding-bottom:84px}
h1,h3{margin:.3em 0}
button{font-family:inherit}
.mu{color:var(--mu)}.s{font-size:12.5px}.c{text-align:center}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
.hi{font-weight:800}
.pill{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:6px 14px;border-radius:99px;font-weight:800;font-size:14px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(60,40,140,.06)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;text-align:center}
.hero .big{font-size:38px;font-weight:800;line-height:1.2}
.hero .s{opacity:.92}
.bar{height:9px;background:rgba(120,120,160,.2);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:#22c55e;border-radius:9px;transition:width .4s}
.card .bar i{background:var(--p)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer;margin-top:8px}
.btn.sec{background:#ecebf8;color:var(--p)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.out{background:#fff;border:1.5px solid var(--er);color:var(--er)}
.chip{background:#eef9f1;color:var(--ok);padding:2px 10px;border-radius:99px;font-weight:800;font-size:13px;white-space:nowrap}
.st{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.st.pending{background:#fff4dc;color:var(--wa)}.st.paid{background:#eef9f1;color:var(--ok)}.st.rejected{background:#fdecec;color:var(--er)}
.note{background:#fff4dc;color:#7a5200;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.note.bad{background:#fdecec;color:var(--er)}.note.ok{background:#eef9f1;color:var(--ok)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 0;color:var(--mu)}
input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--p)}
nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;font-size:11.5px;color:var(--mu);padding:4px 0;cursor:pointer;font-weight:600}
nav button span{display:block;font-size:21px;line-height:1.2}
nav button.on{color:var(--p)}
.auth{max-width:420px;margin:0 auto;padding:28px 16px;text-align:center}
.auth .card{text-align:right}
.logo{font-size:52px}
.seg{display:flex;background:#e7e5f6;border-radius:12px;padding:4px;margin:14px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:800;color:var(--mu);font-size:15px;cursor:pointer}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.splash{padding:80px 20px;text-align:center;color:var(--mu)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}
.pos{color:var(--ok);font-weight:800;direction:ltr}.neg{color:var(--er);font-weight:800;direction:ltr}
.copybox{background:#f1f0fb;border:1.5px dashed var(--p);border-radius:12px;padding:10px;font-size:13px;word-break:break-all;direction:ltr;text-align:left;margin:8px 0}
.code{font-size:28px;font-weight:800;letter-spacing:4px;color:var(--p)}
#modal{position:fixed;inset:0;background:rgba(20,15,50,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.mb{padding:12px 16px}.mf{padding:12px 16px 18px;border-top:1px solid var(--bd)}
.x{border:0;background:#eee;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer}
.adbox{min-height:240px;background:#0f0d1f;display:flex;align-items:center;justify-content:center;overflow:hidden}
.adbox iframe,.adbox video{width:100%;height:260px;border:0;background:#000}
.adbox img{max-width:100%;max-height:300px;display:block}
.linkad{color:#fff;text-align:center;padding:24px}.linkad .btn{max-width:220px;margin:12px auto 0}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:#1b1b2f;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;transition:transform .3s;max-width:90%;text-align:center;font-size:14px}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--er)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import { getDatabase, ref, get, set, update, push, query, limitToLast, onValue, serverTimestamp, increment } from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js';

// ===== إعدادات Firebase =====
const firebaseConfig = {
  apiKey: 'AIzaSyB_L9kvS_UfJyWBL73b1LjiLzkc8xcdvtI',
  authDomain: 'gift-d9fe5.firebaseapp.com',
  databaseURL: 'https://gift-d9fe5-default-rtdb.firebaseio.com',
  projectId: 'gift-d9fe5',
  storageBucket: 'gift-d9fe5.firebasestorage.app',
  messagingSenderId: '236576816592',
  appId: '1:236576816592:web:011fea70826974884b0dd5'
};
// اختياري: مفتاح reCAPTCHA v3 لـ App Check (بيصعّب على البوتات). سيبه فاضي لو مش مفعّل.
const APPCHECK_SITE_KEY = '';

const app = initializeApp(firebaseConfig);
if (APPCHECK_SITE_KEY) {
  try {
    const m = await import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app-check.js');
    m.initializeAppCheck(app, { provider: new m.ReCaptchaV3Provider(APPCHECK_SITE_KEY), isTokenAutoRefreshEnabled: true });
  } catch (e) { console.warn('AppCheck', e); }
}
const auth = getAuth(app);
const db = getDatabase(app);
const H = { ts: () => serverTimestamp(), inc: n => increment(n) };
const EMAIL_DOMAIN = '@gift-app.net'; // لازم يطابق اللي في القواعد

// <OPS>
// كل عمليات الكتابة اللي بتأثر على النقاط. نفس الكود ده بيتختبر ضد قواعد الأمان.
const num = x => Number(x) || 0;
const OPS = {
  dayN: ms => Math.floor((ms + 7200000) / 86400000),
  maskName: n => String(n || '').slice(0, 2) + '***',
  adReward: (ad, S) => (num(ad.reward) > 0 ? num(ad.reward) : num(S.adReward)),
  register(uid, f, S) {
    const bonus = num(S.signupBonus) + (f.referredBy !== '-' ? num(S.inviteeBonus) : 0);
    const u = {};
    u['users/' + uid] = {
      name: f.name, phone: f.phone, refCode: f.code, refBy: f.refBy, referredBy: f.referredBy, did: f.did,
      points: bonus, totalEarned: bonus, adsWatched: 0, qualified: 0, status: 'active', createdAt: H.ts(),
      adDay: 0, adsToday: 0, lastAdAt: 0, lastTask: '-', lastRefClaim: '-', refClaimedCount: 0, pendingW: '-'
    };
    u['refCodes/' + f.code] = uid;
    if (num(S.deviceLimit) === 1) u['devices/' + f.did] = uid;
    return u;
  },
  adStart(uid, adId) { const o = {}; o['users/' + uid + '/adSess'] = { ad: adId, at: H.ts() }; return o; },
  adClaim(uid, u, ad, S, day) {
    const r = OPS.adReward(ad, S), p = 'users/' + uid + '/', o = {};
    o[p + 'points'] = H.inc(r); o[p + 'totalEarned'] = H.inc(r); o[p + 'adsWatched'] = H.inc(1);
    o[p + 'adDay'] = day; o[p + 'adsToday'] = (u.adDay === day ? H.inc(1) : 1);
    o[p + 'lastAdAt'] = H.ts(); o[p + 'adSess'] = null;
    return o;
  },
  taskStart(uid, tid) { const o = {}; o['users/' + uid + '/tstart/' + tid] = H.ts(); return o; },
  taskClaim(uid, tid, t, day) {
    const p = 'users/' + uid + '/', o = {};
    const daily = t.type === 'daily' || (t.type === 'link' && t.repeat === 'daily');
    o[p + 'points'] = H.inc(t.reward); o[p + 'totalEarned'] = H.inc(t.reward); o[p + 'lastTask'] = tid;
    o[p + 'done/' + tid] = daily ? day : 1;
    if (t.type === 'link' && t.verify === 'auto') o[p + 'tstart/' + tid] = null;
    return o;
  },
  submit(uid, tid, proof) { const o = {}; o['submissions/' + tid + '/' + uid] = { proof: proof, status: 'pending', createdAt: H.ts() }; return o; },
  qualify(uid, u) {
    const o = {};
    o['users/' + uid + '/qualified'] = 1;
    o['referrals/' + u.referredBy + '/' + uid] = { name: OPS.maskName(u.name), at: H.ts(), claimed: false };
    return o;
  },
  refClaim(uid, cid, S) {
    const p = 'users/' + uid + '/', b = num(S.referralBonus), o = {};
    o[p + 'points'] = H.inc(b); o[p + 'totalEarned'] = H.inc(b); o[p + 'refClaimedCount'] = H.inc(1);
    o[p + 'lastRefClaim'] = cid; o['referrals/' + uid + '/' + cid + '/claimed'] = true;
    return o;
  },
  withdraw(uid, wid, pts, method, account) {
    const o = {};
    o['users/' + uid + '/points'] = H.inc(-pts); o['users/' + uid + '/pendingW'] = wid;
    o['withdrawals/' + uid + '/' + wid] = { points: pts, method: method, account: account, status: 'pending', createdAt: H.ts() };
    return o;
  },
  ledger: (type, points, note) => ({ type: type, points: points, note: String(note || '').slice(0, 120), ts: H.ts() })
};
// </OPS>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const LS = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} }
};
const METHODS = { vodafone: 'فودافون كاش', instapay: 'إنستاباي', etisalat: 'اتصالات كاش', orange: 'أورنج كاش', we: 'WE Pay' };
const TYPES = { ad: 'إعلان', task: 'مهمة', referral: 'مكافأة دعوة', commission: 'نسبة من سحب صديق', bonus: 'هدية', withdraw: 'طلب سحب', refund: 'استرجاع', adjust: 'تعديل رصيد' };
const STATUS = { pending: 'قيد المراجعة', paid: 'تم الدفع', rejected: 'مرفوض' };
const DAY = { 1: 'الاثنين', 2: 'الثلاثاء', 3: 'الأربعاء', 4: 'الخميس', 5: 'الجمعة', 6: 'السبت', 7: 'الأحد' };
const TABS = [['home', '🏠', 'الرئيسية'], ['tasks', '✅', 'المهام'], ['invite', '👥', 'الدعوة'], ['wallet', '💰', 'المحفظة'], ['me', '👤', 'حسابي']];
const S = { user: null, cfg: {}, tab: 'home', mode: 'login', cdT: null, off: 0, unsub: null };
let onClose = null, toastT = null;

(function () {
  const r = new URLSearchParams(location.search).get('ref');
  if (r && /^[A-Za-z0-9]{6}$/.test(r)) LS.set('g_ref', r.toUpperCase());
})();

// وقت السيرفر (عشان ما نعتمدش على ساعة الموبايل)
onValue(ref(db, '.info/serverTimeOffset'), s => { S.off = s.val() || 0; });
const serverNow = () => Date.now() + S.off;

function deviceId() {
  let d = LS.get('g_did');
  if (!d || !/^[A-Za-z0-9_-]{8,64}$/.test(d)) {
    d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    LS.set('g_did', d);
  }
  return d;
}
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = '';
  for (let i = 0; i < 6; i++) c += chars.charAt(Math.floor(Math.random() * chars.length));
  return c;
}
function normPhone(p) {
  let d = String(p || '').replace(/[^\d]/g, '');
  if (d.indexOf('0020') === 0) d = d.slice(4);
  else if (d.indexOf('20') === 0 && d.length === 12) d = d.slice(2);
  if (d.length === 10 && d.charAt(0) === '1') d = '0' + d;
  return /^01[0125]\d{8}$/.test(d) ? d : '';
}
function errMsg(e) {
  const c = (e && e.code) || '', m = String((e && e.message) || e || '');
  const map = {
    'auth/invalid-credential': 'الرقم أو كلمة السر غلط', 'auth/wrong-password': 'الرقم أو كلمة السر غلط', 'auth/user-not-found': 'الرقم أو كلمة السر غلط',
    'auth/invalid-login-credentials': 'الرقم أو كلمة السر غلط', 'auth/email-already-in-use': 'الرقم ده مسجل قبل كده، سجّل دخول',
    'auth/weak-password': 'كلمة السر ضعيفة (6 حروف على الأقل)', 'auth/too-many-requests': 'محاولات كتير، استنى شوية وجرّب تاني',
    'auth/network-request-failed': 'مفيش اتصال بالنت', 'auth/operation-not-allowed': 'تسجيل الدخول بالإيميل مش مفعّل في Firebase',
    'auth/requires-recent-login': 'سجّل خروج وادخل تاني وبعدين جرّب'
  };
  if (map[c]) return map[c];
  if (c === 'PERMISSION_DENIED' || /PERMISSION_DENIED|permission denied/i.test(m)) return 'الطلب مرفوض. تأكد من شروط العملية (الانتظار/الحد اليومي/الرصيد) وجرّب تاني';
  if (/network|offline|Failed to fetch/i.test(m)) return 'مفيش اتصال بالنت';
  return m || 'حصل خطأ، حاول تاني';
}
function toast(m, bad) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, 3200);
}
function openModal(html) { const m = $('#modal'); m.innerHTML = '<div class="sheet">' + html + '</div>'; m.className = 'open'; }
function closeModal() { const m = $('#modal'); m.className = ''; m.innerHTML = ''; if (onClose) { const f = onClose; onClose = null; f(); } }
async function busy(btn, fn) {
  if (!btn || btn.disabled) return;
  const t = btn.textContent; btn.disabled = true; btn.dataset.busy = '1'; btn.textContent = '...';
  try { return await fn(); }
  catch (e) { toast(errMsg(e), true); }
  finally { delete btn.dataset.busy; btn.disabled = false; btn.textContent = t; if (btn.id === 'adb') tick(); }
}
function copyText(t) {
  const done = () => toast('تم النسخ ✔');
  const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('انسخ يدوي', true); } a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
function errBox(msg, id) { return '<div class="card c"><p class="mu">' + esc(msg) + '</p><button class="btn sec" id="' + id + '">إعادة المحاولة</button></div>'; }
const toArr = o => Object.keys(o || {}).map(k => Object.assign({ id: k }, o[k]));
const uref = () => ref(db, 'users/' + S.user.uid);
const cfgNum = k => Number(S.cfg[k]) || 0;
const dayNow = () => OPS.dayN(serverNow());

// ===== الدخول والتسجيل =====
function viewAuth(mode) {
  S.mode = mode || S.mode || 'login';
  const reg = S.mode === 'register', ref0 = LS.get('g_ref') || '';
  $('#app').innerHTML = '<div class="auth"><div class="logo">🎁</div><h1>' + esc(S.cfg.appName || 'Gift') + '</h1>' +
    '<p class="mu">' + (reg ? 'سجّل حساب جديد وابدأ الربح من أول إعلان' : 'سجّل دخول وكمّل ربحك') + '</p>' +
    '<div class="seg"><button data-m="login" class="' + (!reg ? 'on' : '') + '">دخول</button><button data-m="register" class="' + (reg ? 'on' : '') + '">حساب جديد</button></div>' +
    '<form id="af" class="card">' +
    '<label>رقم الموبايل<input id="f_phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="01012345678" maxlength="14"></label>' +
    (reg ? '<label>الاسم<input id="f_name" autocomplete="name" maxlength="40" placeholder="اسمك"></label>' : '') +
    '<label>كلمة السر<input id="f_pw" type="password" autocomplete="' + (reg ? 'new-password' : 'current-password') + '" placeholder="6 حروف أو أرقام على الأقل"></label>' +
    (reg ? '<label>تأكيد كلمة السر<input id="f_pw2" type="password" autocomplete="new-password"></label>' +
      '<label>كود الدعوة (اختياري)<input id="f_ref" value="' + esc(ref0) + '" maxlength="6" style="text-transform:uppercase" placeholder="لو عندك كود من صديق"></label>' +
      (ref0 ? '<div class="note ok" style="margin:10px 0 0">✔ هتاخد هدية إضافية لو الكود صحيح</div>' : '') : '') +
    '<button class="btn" id="fsub" type="submit">' + (reg ? 'إنشاء الحساب' : 'دخول') + '</button></form></div>';
  document.querySelectorAll('.seg button').forEach(b => { b.onclick = () => viewAuth(b.dataset.m); });
  $('#af').onsubmit = e => {
    e.preventDefault();
    busy($('#fsub'), async () => {
      const phone = normPhone($('#f_phone').value.trim());
      const pw = $('#f_pw').value;
      if (!phone) throw new Error('اكتب رقم موبايل مصري صحيح (زي 01012345678)');
      if (pw.length < 6) throw new Error('كلمة السر لازم 6 حروف أو أرقام على الأقل');
      if (reg) {
        const name = $('#f_name').value.trim().replace(/^[=+\-@]+/, '');
        if (name.length < 2) throw new Error('اكتب اسمك');
        if (pw !== $('#f_pw2').value) throw new Error('كلمتين السر مش متطابقتين');
        await doRegister(phone, name, pw, $('#f_ref').value.trim().toUpperCase());
      } else {
        const c = await signInWithEmailAndPassword(auth, phone + EMAIL_DOMAIN, pw);
        await enter(c.user);
      }
    });
  };
}

async function doRegister(phone, name, pw, code) {
  let refBy = '-', referredBy = '-';
  if (code) {
    if (!/^[A-Z0-9]{6}$/.test(code)) throw new Error('كود الدعوة غير صحيح');
    const s = await get(ref(db, 'refCodes/' + code));
    if (!s.exists()) throw new Error('كود الدعوة مش موجود، راجعه أو سيبه فاضي');
    refBy = code; referredBy = s.val();
  }
  const cred = await createUserWithEmailAndPassword(auth, phone + EMAIL_DOMAIN, pw);
  const uid = cred.user.uid, did = deviceId();
  const fail = async msg => { try { await deleteUser(cred.user); } catch (e) { try { await signOut(auth); } catch (x) {} } throw new Error(msg); };
  if (cfgNum('deviceLimit') === 1) {
    const d = await get(ref(db, 'devices/' + did));
    if (d.exists()) await fail('الجهاز ده مسجّل بحساب تاني. مسموح بحساب واحد لكل جهاز.');
  }
  let last = null;
  for (let i = 0; i < 6; i++) {
    try {
      await update(ref(db), OPS.register(uid, { phone: phone, name: name, code: genCode(), refBy: refBy, referredBy: referredBy, did: did }, S.cfg));
      LS.del('g_ref');
      await enter(cred.user);
      return;
    } catch (e) { last = e; if (!/PERMISSION_DENIED|permission/i.test(String(e && (e.code || e.message)))) break; }
  }
  await fail(errMsg(last));
}

// الدخول بعد التوثيق: تحميل الملف الشخصي + الاشتراك في التحديثات اللحظية
async function enter(user) {
  if (S.unsub) { S.unsub(); S.unsub = null; }
  const first = await get(ref(db, 'users/' + user.uid));
  if (!first.exists()) { await signOut(auth); throw new Error('الحساب ده ملوش بيانات (التسجيل ما اكتملش). سجّل من جديد برقم تاني أو كلّم الدعم.'); }
  if (first.val().status === 'banned') { await signOut(auth); throw new Error('الحساب ده موقوف. تواصل مع الدعم.'); }
  S.user = Object.assign({ uid: user.uid }, first.val());
  await new Promise(res => {
    let f = true;
    S.unsub = onValue(ref(db, 'users/' + user.uid), snap => {
      if (!snap.exists()) return;
      S.user = Object.assign({ uid: user.uid }, snap.val());
      if (f) { f = false; res(); } else live();
    }, () => { if (f) { f = false; res(); } });
  });
  S.tab = 'home'; viewApp();
  qualifyIfNeeded();
}
function live() {
  const p = $('#pp'); if (p) p.textContent = fmt(S.user.points) + ' نقطة';
  if (S.tab === 'home' && !$('#modal').classList.contains('open')) vHome();
}
async function logout() {
  clearInterval(S.cdT); closeModal();
  if (S.unsub) { S.unsub(); S.unsub = null; }
  await signOut(auth); S.user = null; viewAuth('login'); toast('تم تسجيل الخروج');
}

// ===== الرئيسية + الإعلانات =====
function adState() {
  const u = S.user, c = S.cfg;
  const today = u.adDay === dayNow() ? (u.adsToday || 0) : 0;
  const left = Math.ceil(((u.lastAdAt || 0) + cfgNum('adCooldownSec') * 1000 - serverNow()) / 1000);
  return { today: today, limit: cfgNum('dailyAdLimit'), left: left, full: today >= cfgNum('dailyAdLimit') };
}
function vHome() {
  const u = S.user, c = S.cfg, ppu = cfgNum('pointsPerUsd') || 10000;
  const usd = u.points / ppu, min = cfgNum('minWithdrawUsd') * ppu;
  const pct = min ? Math.min(100, Math.round(u.points / min * 100)) : 0;
  const st = adState();
  $('#view').innerHTML = (c.announcement && String(c.announcement).trim() ? '<div class="note">📢 ' + esc(c.announcement) + '</div>' : '') +
    '<div class="hero"><div class="s">رصيدك</div><div class="big">' + fmt(u.points) + '</div><div class="s">≈ $' + usd.toFixed(2) + ' · ' + fmt(Math.round(usd * cfgNum('usdToEgp'))) + ' جنيه</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="s">' + (pct >= 100 ? 'تقدر تطلب سحب ✔' : 'باقي ' + fmt(Math.max(0, min - u.points)) + ' نقطة للوصول لحد السحب (' + cfgNum('minWithdrawUsd') + '$)') + '</div></div>' +
    '<div class="card"><div class="row"><b>▶ شاهد واكسب</b><span class="mu s">' + st.today + '/' + st.limit + ' النهارده</span></div><p class="mu s">شاهد إعلان قصير واستلم نقاطك فوراً.</p><button class="btn" id="adb">...</button></div>' +
    '<div class="grid2"><div class="card c"><div class="mu s">إجمالي ما كسبته</div><b>' + fmt(u.totalEarned) + '</b></div><div class="card c"><div class="mu s">إعلانات شاهدتها</div><b>' + fmt(u.adsWatched) + '</b></div></div>';
  $('#adb').onclick = () => busy($('#adb'), startAd);
  tick(); S.cdT = setInterval(tick, 1000);
}
function tick() {
  const b = $('#adb'); if (!b || S.tab !== 'home' || b.dataset.busy) return;
  const st = adState();
  b.disabled = st.full || st.left > 0;
  b.textContent = st.full ? 'وصلت للحد اليومي، ارجع بكرة' : (st.left > 0 ? 'استنى ' + st.left + ' ثانية' : '▶ شاهد إعلان واكسب');
}
function pickAd(ads) {
  let total = 0; ads.forEach(a => { total += Math.max(1, Number(a.weight) || 1); });
  let r = Math.random() * total;
  for (const a of ads) { r -= Math.max(1, Number(a.weight) || 1); if (r <= 0) return a; }
  return ads[0];
}
async function startAd() {
  const st = adState();
  if (st.full) throw new Error('وصلت للحد اليومي، ارجع بكرة');
  if (st.left > 0) throw new Error('استنى ' + st.left + ' ثانية');
  const ads = toArr((await get(ref(db, 'ads'))).val()).filter(a => a.active === true);
  if (!ads.length) throw new Error('مفيش إعلانات متاحة دلوقتي، جرّب بعد شوية');
  const ad = pickAd(ads);
  await update(ref(db), OPS.adStart(S.user.uid, ad.id));
  showAd(ad);
}

function buildAd(ad, box, onOpen) {
  if (ad.type === 'video') {
    const m = String(ad.content || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if (m) {
      const f = document.createElement('iframe'); f.allow = 'autoplay; encrypted-media'; f.allowFullscreen = true;
      f.src = 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&mute=1&controls=0&playsinline=1&rel=0'; box.appendChild(f);
    } else {
      const v = document.createElement('video'); v.src = ad.content; v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true; box.appendChild(v);
    }
  } else if (ad.type === 'image') {
    const im = document.createElement('img'); im.src = ad.content;
    if (ad.url) { const a = document.createElement('a'); a.href = ad.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.appendChild(im); box.appendChild(a); } else box.appendChild(im);
  } else if (ad.type === 'html') {
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms');
    f.srcdoc = '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff">' + ad.content;
    box.appendChild(f);
  } else {
    box.innerHTML = '<div class="linkad"><div style="font-size:40px">🎬</div><p>اضغط الزر لفتح الإعلان، وشاهده لحد ما العداد يخلص</p><button class="btn sec" id="opad">فتح الإعلان</button></div>';
    $('#opad').onclick = () => { window.open(ad.url, '_blank', 'noopener'); onOpen(); };
  }
}

function showAd(ad) {
  const dur = Math.min(120, Math.max(5, Number(ad.durationSec) || 15)) + 1;
  let left = dur, started = ad.type !== 'link', done = false;
  const reward = OPS.adReward(ad, S.cfg);
  openModal('<div class="mh"><b>' + esc(ad.name) + '</b><button class="x" id="mx">✕</button></div><div id="adbox" class="adbox"></div>' +
    '<div class="mf"><div class="mu s c" id="adl"></div><button class="btn" id="adc" disabled>استلم +' + fmt(reward) + ' نقطة</button></div>');
  buildAd(ad, $('#adbox'), () => { started = true; upd(); });
  function upd() {
    const l = $('#adl'); if (!l) return;
    l.textContent = done ? 'تمت المشاهدة ✔' : (started ? 'باقي ' + left + ' ثانية' + (ad.type !== 'link' && document.hidden ? ' (ارجع للتطبيق)' : '') : 'افتح الإعلان عشان يبدأ العداد');
  }
  upd();
  const iv = setInterval(() => {
    if (!started || done) return;
    if (ad.type !== 'link' && document.hidden) return;
    left--;
    if (left <= 0) { left = 0; done = true; clearInterval(iv); const b = $('#adc'); if (b) b.disabled = false; }
    upd();
  }, 1000);
  onClose = () => clearInterval(iv);
  $('#mx').onclick = closeModal;
  $('#adc').onclick = () => busy($('#adc'), async () => {
    const fresh = (await get(uref())).val();
    await update(ref(db), OPS.adClaim(S.user.uid, fresh, ad, S.cfg, dayNow()));
    toast('+' + fmt(reward) + ' نقطة 🎉'); closeModal();
    ledger('ad', reward, 'مشاهدة إعلان');
    try { await update(ref(db, 'ads/' + ad.id), { views: increment(1) }); } catch (e) {}
    qualifyIfNeeded();
  });
}

// ===== المهام =====
async function autoClaimRefs() {
  let n = 0;
  try {
    const es = toArr((await get(ref(db, 'referrals/' + S.user.uid))).val()).filter(e => e.claimed === false);
    for (const e of es) {
      try { await update(ref(db), OPS.refClaim(S.user.uid, e.id, S.cfg)); n++; ledger('referral', cfgNum('referralBonus'), 'مكافأة دعوة: ' + e.name); } catch (x) { break; }
    }
  } catch (e) {}
  if (n) toast('+' + fmt(n * cfgNum('referralBonus')) + ' نقطة من دعواتك 🎉');
  return n;
}
async function vTasks() {
  $('#view').innerHTML = '<div class="splash">جاري التحميل…</div>';
  let ts;
  try {
    await autoClaimRefs();
    ts = toArr((await get(ref(db, 'tasks'))).val()).filter(t => t.active === true);
    for (const t of ts) { if (t.type === 'link' && t.verify === 'manual') { const s = await get(ref(db, 'submissions/' + t.id + '/' + S.user.uid)); t.sub = s.exists() ? s.val() : null; } }
  } catch (e) { if (S.tab === 'tasks') { $('#view').innerHTML = errBox(errMsg(e), 'rt'); $('#rt').onclick = vTasks; } return; }
  if (S.tab !== 'tasks') return;
  ts.forEach(t => { t.st = taskStatus(t); });
  $('#view').innerHTML = '<h3>المهام</h3>' + (ts.length ? ts.map(taskCard).join('') : '<div class="card c mu">مفيش مهام دلوقتي، ارجع بعدين</div>');
  ts.forEach(t => { const b = document.querySelector('[data-tid="' + t.id + '"]'); if (b) b.onclick = () => busy(b, () => taskAct(t)); });
}
function taskStatus(t) {
  const u = S.user, day = dayNow(), mark = (u.done || {})[t.id];
  const daily = t.type === 'daily' || (t.type === 'link' && t.repeat === 'daily');
  const done = daily ? mark === day : mark !== undefined;
  if (done) return 'done';
  if (t.sub && t.sub.status === 'pending') return 'pending';
  if (t.type === 'referral' && (u.refClaimedCount || 0) >= t.target) return 'claimable';
  return 'available';
}
function taskCard(t) {
  const u = S.user, st = t.st;
  const extra = t.type === 'referral' ? '<div class="bar"><i style="width:' + Math.round(Math.min(u.refClaimedCount || 0, t.target) / t.target * 100) + '%"></i></div><div class="mu s">' + Math.min(u.refClaimedCount || 0, t.target) + '/' + t.target + ' أصحاب فعّالين</div>' : '';
  const lbl = { available: t.type === 'daily' ? 'استلم' : (t.type === 'referral' ? 'ادعُ أصحابك' : 'ابدأ المهمة'), claimable: 'استلم المكافأة', done: (t.type === 'daily' || t.repeat === 'daily') ? 'تم النهارده ✔' : 'تم ✔', pending: 'قيد المراجعة ⏳' }[st];
  const off = st === 'done' || st === 'pending';
  return '<div class="card"><div class="row"><b>' + esc(t.title) + '</b><span class="chip">+' + fmt(t.reward) + '</span></div>' +
    (t.desc ? '<p class="mu s" style="margin:4px 0">' + esc(t.desc) + '</p>' : '') + extra +
    (t.sub && t.sub.status === 'rejected' && st === 'available' ? '<div class="note bad" style="margin:8px 0 0">الإثبات السابق اترفض، جرّب تاني</div>' : '') +
    '<button class="btn ' + (off ? 'sec' : '') + '" data-tid="' + esc(t.id) + '"' + (off ? ' disabled' : '') + '>' + lbl + '</button></div>';
}
async function taskAct(t) {
  const uid = S.user.uid;
  if (t.type === 'daily' || t.st === 'claimable') {
    await update(ref(db), OPS.taskClaim(uid, t.id, t, dayNow()));
    toast('+' + fmt(t.reward) + ' نقطة 🎉'); ledger('task', t.reward, 'مهمة: ' + t.title); return vTasks();
  }
  if (t.type === 'referral') { go('invite'); return; }
  const w = window.open('', '_blank');
  try { await update(ref(db), OPS.taskStart(uid, t.id)); } catch (e) { if (w) w.close(); throw e; }
  if (w) { try { w.opener = null; } catch (x) {} w.location.href = t.url; }
  showTask(t);
}
function showTask(t) {
  const end = Date.now() + (Number(t.timerSec) || 0) * 1000 + 1500, manual = t.verify === 'manual';
  openModal('<div class="mh"><b>' + esc(t.title) + '</b><button class="x" id="mx">✕</button></div><div class="mb"><p class="mu">' + esc(t.desc || 'نفّذ المطلوب في الصفحة اللي اتفتحت.') + '</p><button class="btn sec" id="reopen">فتح الرابط تاني</button>' +
    (manual ? '<label>إثبات التنفيذ (اسم حسابك أو رابطه)<input id="proof" maxlength="200"></label>' : '') + '</div>' +
    '<div class="mf"><div class="mu s c" id="tl"></div><button class="btn" id="tc" disabled>' + (manual ? 'إرسال للمراجعة' : 'استلم +' + fmt(t.reward) + ' نقطة') + '</button></div>');
  $('#reopen').onclick = () => window.open(t.url, '_blank', 'noopener');
  const iv = setInterval(() => {
    const l = $('#tl'); if (!l) { clearInterval(iv); return; }
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    l.textContent = left > 0 ? 'باقي ' + left + ' ثانية' : 'جاهز ✔';
    if (left <= 0) { $('#tc').disabled = false; clearInterval(iv); }
  }, 500);
  onClose = () => clearInterval(iv);
  $('#mx').onclick = closeModal;
  $('#tc').onclick = () => busy($('#tc'), async () => {
    if (manual) {
      const proof = $('#proof').value.trim();
      if (proof.length < 3) throw new Error('اكتب إثبات التنفيذ (اسم حسابك مثلاً)');
      await update(ref(db), OPS.submit(S.user.uid, t.id, proof));
      toast('اتبعت للمراجعة ✔'); closeModal(); vTasks();
    } else {
      await update(ref(db), OPS.taskClaim(S.user.uid, t.id, t, dayNow()));
      toast('+' + fmt(t.reward) + ' نقطة 🎉'); closeModal(); ledger('task', t.reward, 'مهمة: ' + t.title); vTasks();
    }
  });
}

    '<div class="card"><b>طلبات السحب</b>' + (ws.length ? ws.map(w => '<div class="li"><span>' + fmt(w.points) + ' نقطة · ' + esc(METHODS[w.method] || w.method) + '<div class="mu s">' + (w.createdAt ? esc(new Date(w.createdAt).toLocaleString('ar-EG')) : '') + (w.note ? ' · ' + esc(w.note) : '') + '</div></span><span class="st ' + esc(w.status) + '">' + (STATUS[w.status] || '') + '</span></div>').join('') : '<p class="mu s">مفيش طلبات لسه</p>') + '</div>' +
    '<div class="card"><b>آخر العمليات</b>' + (hist.length ? hist.map(h => '<div class="li"><span>' + esc(TYPES[h.type] || h.type) + '<div class="mu s">' + esc(h.note || '') + '</div></span><span class="' + (h.points >= 0 ? 'pos' : 'neg') + '">' + (h.points >= 0 ? '+' : '') + fmt(h.points) + '</span></div>').join('') : '<p class="mu s">مفيش عمليات لسه</p>') + '</div>';
  const calc = () => { const p = parseInt($('#wp').value, 10) || 0, usd = p / ppu; $('#wc').textContent = p > 0 ? '≈ $' + usd.toFixed(2) + ' · ' + fmt(Math.round(usd * cfgNum('usdToEgp'))) + ' جنيه' : '—'; };
  $('#wp').oninput = calc;
  $('#wmax').onclick = () => { $('#wp').value = S.user.points; calc(); };
  $('#wm').onchange = () => { const ip = $('#wm').value === 'instapay'; $('#wal_t').textContent = ip ? 'رقم أو عنوان إنستاباي' : 'رقم المحفظة'; $('#wa').placeholder = ip ? 'name@instapay أو رقم' : '01xxxxxxxxx'; };
  $('#wgo').onclick = () => busy($('#wgo'), async () => {
    const p = parseInt($('#wp').value, 10) || 0, acc = $('#wa').value.trim(), m = $('#wm').value;
    if (days.length && days.indexOf(String(new Date(serverNow() + 7200000).getUTCDay() || 7)) < 0) throw new Error('السحب متاح أيام: ' + daysTxt);
    if (m === 'instapay') { if (acc.length < 5) throw new Error('اكتب رقم أو عنوان إنستاباي صحيح'); }
    else if (!normPhone(acc)) throw new Error('اكتب رقم المحفظة صح (11 رقم)');
    if (p < minPts) throw new Error('أقل مبلغ للسحب ' + fmt(minPts) + ' نقطة');
    if (p > S.user.points) throw new Error('رصيدك مش كفاية');
    if (!confirm('تأكيد سحب ' + fmt(p) + ' نقطة على ' + acc + ' ؟')) return;
    const wid = push(ref(db, 'withdrawals/' + S.user.uid)).key;
    await update(ref(db), OPS.withdraw(S.user.uid, wid, p, m, m === 'instapay' ? acc : normPhone(acc)));
    toast('تم إرسال الطلب ✔'); ledger('withdraw', -p, 'طلب سحب'); vWallet();
  });
}

// ===== حسابي =====
function vMe() {
  const u = S.user, c = S.cfg;
  $('#view').innerHTML = '<div class="card"><b>' + esc(u.name) + '</b><div class="mu">' + esc(u.phone) + '</div><div class="mu s">كود الدعوة: ' + esc(u.refCode) + '</div></div>' +
    '<div class="card"><b>تغيير كلمة السر</b><label>الحالية<input id="op" type="password" autocomplete="current-password"></label><label>الجديدة<input id="np" type="password" autocomplete="new-password"></label><button class="btn sec" id="cpw">حفظ</button></div>' +
    (c.supportLink && String(c.supportLink).trim() ? '<a class="btn sec" style="text-align:center;text-decoration:none" href="' + esc(c.supportLink) + '" target="_blank" rel="noopener">💬 الدعم</a>' : '') +
    '<button class="btn out" id="lo">تسجيل الخروج</button>';
  $('#cpw').onclick = () => busy($('#cpw'), async () => {
    const np = $('#np').value;
    if (np.length < 6) throw new Error('كلمة السر الجديدة 6 حروف على الأقل');
    await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(u.phone + EMAIL_DOMAIN, $('#op').value));
    await updatePassword(auth.currentUser, np);
    $('#op').value = ''; $('#np').value = ''; toast('تم تغيير كلمة السر ✔');
  });
  $('#lo').onclick = logout;
}

// ===== التشغيل =====
async function boot() {
  $('#app').innerHTML = '<div class="splash">🎁<br>جاري التحميل…</div>';
  try { S.cfg = (await get(ref(db, 'settings'))).val() || {}; }
  catch (e) { $('#app').innerHTML = '<div class="auth">' + errBox(errMsg(e), 'rt') + '</div>'; $('#rt').onclick = boot; return; }
  document.title = S.cfg.appName || 'Gift';
  if (cfgNum('maintenance') === 1) { $('#app').innerHTML = '<div class="auth"><div class="logo">🛠️</div><h3>التطبيق تحت الصيانة</h3><p class="mu">هنرجع قريب، جرّب بعد شوية.</p></div>'; return; }
  await auth.authStateReady();
  if (auth.currentUser) {
    try { await enter(auth.currentUser); }
    catch (e) { viewAuth('login'); toast(errMsg(e), true); }
  } else viewAuth(LS.get('g_ref') ? 'register' : 'login');
}
boot();
</script>
